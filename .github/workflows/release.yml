name: ActiLens Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.2.0)"
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $CANDIDATE" >&2
            echo "Expected vMAJOR.MINOR.PATCH, optionally with a prerelease suffix." >&2
            exit 1
          fi
          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Release version: $CANDIDATE"

  validate:
    name: Validate release candidate
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: actilens
          POSTGRES_PASSWORD: actilens
          POSTGRES_DB: actilens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actilens -d actilens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate RU/EN and light/dark UI contract
        run: python3 scripts/check-ui-contract.py
      - name: Typecheck and build web admin
        run: |
          pnpm --filter @actilens/web-admin typecheck
          pnpm --filter @actilens/web-admin build
      - name: Typecheck desktop UI
        run: pnpm --filter @actilens/desktop typecheck
      - name: Test and build backend
        working-directory: apps/backend
        run: |
          go test ./...
          go build ./cmd/server
      - name: Run PostgreSQL acceptance and production-upgrade tests
        working-directory: apps/backend
        env:
          ACTILENS_TEST_DATABASE_URL: postgres://actilens:actilens@127.0.0.1:5432/actilens?sslmode=disable
        run: go test ./internal/store -count=1
      - name: Validate deployment scripts
        run: |
          bash -n install-linux.sh
          bash -n actilensctl.sh
          bash -n scripts/set-version.sh

  windows:
    name: Build Windows installers
    needs: [prepare, validate]
    runs-on: windows-latest
    env:
      # Public releases are server-agnostic. Deployment selects the backend at
      # runtime via install-windows-agent.ps1 / ACTILENS_BACKEND_URL.
      ACTILENS_BUILD_SERVER_URL: http://127.0.0.1:8081
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set application version from release
        shell: pwsh
        run: python scripts/set-version.py $env:RELEASE_VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Install dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          pnpm install --frozen-lockfile
      - name: Build MSI and EXE
        shell: pwsh
        run: pnpm --filter @actilens/desktop tauri build --target x86_64-pc-windows-msvc
      - name: Normalize Windows release asset names
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' -File | Select-Object -First 1
          $exe = Get-ChildItem 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $msi) { throw 'MSI bundle was not produced' }
          if (-not $exe) { throw 'NSIS bundle was not produced' }
          New-Item -ItemType Directory -Force 'release-windows' | Out-Null
          Copy-Item -LiteralPath $msi.FullName -Destination 'release-windows/ActiLens-x64.msi'
          Copy-Item -LiteralPath $exe.FullName -Destination 'release-windows/ActiLens-x64-setup.exe'
          Copy-Item -LiteralPath 'install-windows-agent.ps1' -Destination 'release-windows/install-windows-agent.ps1'
          Get-ChildItem 'release-windows' | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: release-windows/*

  docker:
    name: Publish Docker image
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/0xdive/actilens
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [prepare, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/ActiLens-x64.msi
            release-assets/ActiLens-x64-setup.exe
            release-assets/install-windows-agent.ps1
          body: |
            ActiLens ${{ needs.prepare.outputs.version }}.

            Docker image: `ghcr.io/0xdive/actilens:${{ needs.prepare.outputs.version }}`
            Windows client: server-agnostic; configure it during provisioning with `install-windows-agent.ps1`.
