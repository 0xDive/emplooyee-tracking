name: ActiLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actilens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Detect whether Windows build is required
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          elif [ -z "${BEFORE_SHA:-}" ] || printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
            git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA" > /tmp/changed.txt
          else
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed.txt
          fi

          echo "Changed files:"
          cat /tmp/changed.txt

          if grep -Eq '^(apps/desktop/|packages/|build-windows-client\.ps1$|install-windows-agent\.ps1$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|scripts/set-version\.py$|\.github/workflows/(ci|release|windows-build)\.yml$)' /tmp/changed.txt; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Backend + web + deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = [
              "B" + "i" + "B" + "o",
              "b" + "i" + "b" + "o",
              "Brian" + " Nguyen",
              "brian" + ".nguyen",
              "ngn" + "clht1102",
              "emplooyee" + "-tracking",
              "employee" + "track",
              "c" + "tracking",
              "C" + "TRACKING",
          ]
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for needle in needles:
                  if needle in text:
                      hits.append(f"{path}: {needle}")
          if hits:
              raise SystemExit("Legacy identifiers found:\n" + "\n".join(hits))
          PY
      - name: Reject legacy web-admin design usage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("apps/web-admin/src")
          legacy_classes = {
              "ad-*": re.compile(r"(?<![A-Za-z0-9_-])ad-[A-Za-z0-9_-]+"),
              "actilens-*": re.compile(r"(?<![A-Za-z0-9_-])actilens-[A-Za-z0-9_-]+"),
          }
          forbidden_refs = {
              "components/ui": "legacy UI primitive import",
              "LanguageSwitcher": "removed legacy language switcher",
              "BusinessPicker": "removed legacy business picker",
              "Sparkline": "removed placeholder sparkline component",
          }
          hits = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".css"}:
                  continue
              source = path.read_text(encoding="utf-8")
              for label, pattern in legacy_classes.items():
                  match = pattern.search(source)
                  if match:
                      hits.append(f"{path}: legacy {label} class ({match.group(0)})")
              for needle, label in forbidden_refs.items():
                  if needle in source:
                      hits.append(f"{path}: {label} ({needle})")
          if hits:
              raise SystemExit(
                  "Legacy web-admin design usage found:\n" + "\n".join(hits)
              )
          PY
      - name: Validate RU/EN and light/dark UI contract
        run: python3 scripts/check-ui-contract.py
      - name: Validate ActiLens brand integrity
        run: python3 scripts/check-brand-assets.py
      - name: Validate Linux deployment scripts
        run: |
          bash -n bootstrap-linux.sh
          bash -n install-linux.sh
          bash -n actilensctl.sh
          sh -n deploy/docker-entrypoint.sh
          docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config >/dev/null
          DOMAIN=tracker.example.com PUBLIC_ORIGIN=https://tracker.example.com ACTILENS_BIND_ADDR=127.0.0.1 \
            docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml config >/dev/null
      - name: Validate release version synchronizer
        run: |
          python3 -m py_compile scripts/set-version.py
          python3 scripts/set-version.py 9.9.9
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('apps/desktop/package.json').read_text())['version'] == '9.9.9'
          assert json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())['version'] == '9.9.9'
          cargo = Path('apps/desktop/src-tauri/Cargo.toml').read_text()
          assert 'version = "9.9.9"' in cargo
          PY
          git checkout -- apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck web admin
        run: pnpm --filter @actilens/web-admin typecheck
      - name: Build web admin
        run: pnpm --filter @actilens/web-admin build
      - name: Typecheck design fixtures
        run: pnpm --filter @actilens/design typecheck
      - name: Build design fixtures
        run: pnpm --filter @actilens/design build
      - name: Typecheck desktop UI
        run: pnpm --filter @actilens/desktop typecheck
      - name: Test backend
        working-directory: apps/backend
        run: go test ./...
      - name: Build backend
        working-directory: apps/backend
        run: go build ./...


  backend-integration:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actilens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d actilens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACTILENS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/actilens_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - name: Run PostgreSQL integration tests
        working-directory: apps/backend
        run: go test ./internal/store -run '^TestIntegration' -count=1 -v

  windows:
    name: Windows installer
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    # PR/CI artifacts must never be pointed at a real production server by accident.
    # Production/custom installers are built by release.yml or windows-build.yml.
    env:
      ACTILENS_BUILD_SERVER_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('build-windows-client.ps1', 'install-windows-agent.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "$script contains syntax errors"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop UI
        shell: pwsh
        run: pnpm --filter @actilens/desktop typecheck
      - name: Test desktop Rust core
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib --target x86_64-pc-windows-msvc
      - name: Build Windows MSI and EXE
        shell: pwsh
        run: pnpm --filter @actilens/desktop tauri build --target x86_64-pc-windows-msvc
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ActiLens-Windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
